name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dev:
    needs: [workspace, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev-api.yml
    secrets: inherit
    with:
      source_ref: ${{ github.sha }}

  native-changes:
    name: Detect native changes
    concurrency:
      group: ci-native-changes-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
          cache: false
      - name: Check native build inputs
        id: changes
        run: vp node scripts/ci-native-changes.mjs

  workspace:
    name: Workspace checks
    concurrency:
      group: ci-workspace-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue:max; actionlint 1.7.12 has not added it yet.
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$' .github/workflows/*.yml
      - name: Formatting, lint and type checks
        run: vp check
      - name: App-specific lint checks
        run: |
          vp run --filter @qcksys/ao3tracker-api biome:ci --error-on-warnings
          vp run --filter ao3tracker-webview-scripts biome:ci --error-on-warnings
      - name: Release automation tests
        run: vp node --test scripts/*.test.mjs
      - name: Workspace tests
        run: vp run -r test
      - name: Seeded sync end-to-end tests
        run: vp run test:e2e
      - name: Workspace builds
        run: vp run -r build

  native:
    name: ${{ matrix.name }}
    concurrency:
      group: ci-native-${{ matrix.target }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    needs: native-changes
    if: needs.native-changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: checks
            name: JVM tests and Android Debug
            tasks: :composeApp:jvmTest :composeApp:assembleDebug
          - target: dev
            name: Android Dev build
            tasks: :composeApp:assembleDev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: external
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            native-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ matrix.target }}-
      - run: vp install --frozen-lockfile
      - name: Run native checks
        run: >-
          bash apps/native-kmp/gradlew -p apps/native-kmp
          ${{ matrix.tasks }}
          -x :composeApp:vpInstall --no-configuration-cache --profile
      - name: Stop Gradle before saving cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: bash apps/native-kmp/gradlew -p apps/native-kmp --stop
      - name: Save Gradle cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Build profile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-build-profile-${{ matrix.target }}
          path: apps/native-kmp/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test reports
        if: always() && matrix.target == 'checks'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-reports
          path: |
            apps/native-kmp/composeApp/build/reports/tests/
            apps/native-kmp/composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Android debug APK
        if: matrix.target == 'checks'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-debug
          path: apps/native-kmp/composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android and JVM checks
    needs: [native-changes, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify native results
        env:
          CHANGES_RESULT: ${{ needs.native-changes.result }}
          NATIVE_REQUIRED: ${{ needs.native-changes.outputs.required }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "success" ]]; then
            if [[ "$NATIVE_REQUIRED" == "false" && "$NATIVE_RESULT" == "skipped" ]]; then
              echo "No native build inputs changed."
              exit 0
            fi
            if [[ "$NATIVE_REQUIRED" == "true" && "$NATIVE_RESULT" == "success" ]]; then
              echo "All native checks passed."
              exit 0
            fi
          fi
          echo "::error::Native checks failed, were cancelled, or could not be evaluated."
          exit 1
