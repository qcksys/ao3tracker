name: Generate patch notes and release tags

on:
  workflow_call:
    outputs:
      tagged:
        description: New Changesets tags were created and verified for the tested commit
        value: ${{ jobs.version.outputs.tagged }}

permissions:
  contents: read

concurrency:
  group: changesets-main
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tagged: ${{ steps.tags.outputs.tagged }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - name: Check tested commit is still current main
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node scripts/release-main.mjs
      - name: Update the patch notes PR or create release tags
        if: steps.release.outputs.eligible == 'true'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run version-packages
          publish-script: vp exec changeset git-tag
          pr-base-branch: main
          pr-title: "chore: update package versions and patch notes"
          commit-message: "chore: update package versions and patch notes"
          create-github-releases: false
          push-git-tags: true
      - name: Verify new release tags point to the tested commit
        if: steps.changesets.outputs.published == 'true'
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          tags=$(jq -er '.[] | .name + "@" + .version' <<< "$TAGGED_PACKAGES")
          while IFS= read -r tag; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            if [[ "$sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $tag does not point to the tested commit."
              exit 1
            fi
          done <<< "$tags"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
