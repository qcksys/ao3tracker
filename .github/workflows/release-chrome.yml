name: Release Chrome extension

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit that passed CI
        required: true
        type: string
      channel:
        type: string
        default: production
      build_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Store item to release (beta submits for review)
        type: choice
        default: production
        options: [production, beta]
      build_only:
        description: Build a ZIP without uploading (use for the first store listing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release-${{ inputs.channel }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: chrome-web-store
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_BRANCH: ${{ inputs.channel == 'beta' && 'dev' || 'main' }}
      CHROME_BUILD_ONLY: ${{ inputs.build_only }}
      CHROME_EXTENSION_ID: ${{ vars[inputs.channel == 'beta' && 'CHROME_BETA_EXTENSION_ID' || 'CHROME_EXTENSION_ID'] }}
      CHROME_BETA_PUBLIC_KEY: ${{ vars.CHROME_BETA_PUBLIC_KEY }}
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
    steps:
      - name: Validate release channel
        run: |
          case "$RELEASE_CHANNEL" in
            production|beta) ;;
            *) echo "::error::Release channel must be production or beta."; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
          cache: true
      - name: Reject stale automatic release retries
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Allocate a fresh release version
        id: version
        run: vp node scripts/release-version.mjs
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Check shared packages and extension
        run: |
          vp node --test scripts/release-chrome.test.mjs
          vp run --filter @qcksys/ao3tracker-core --filter @qcksys/ao3tracker-sync-client typecheck
          vp run --filter @qcksys/ao3tracker-browser-extension compile
          vp run --filter @qcksys/ao3tracker-core --filter @qcksys/ao3tracker-sync-client --filter @qcksys/ao3tracker-browser-extension test
      - name: Build Chrome ZIP
        env:
          CHROME_VERSION: ${{ steps.version.outputs.chrome_version }}
          CHROME_VERSION_NAME: ${{ steps.version.outputs.android_version_name }}
        run: vp run --filter @qcksys/ao3tracker-browser-extension zip -b chrome --mode "$RELEASE_CHANNEL"
      - name: Save Chrome release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chrome-extension-${{ inputs.channel }}-${{ steps.version.outputs.chrome_version }}-${{ inputs.source_ref || github.sha }}
          path: apps/browser-extension/.output/*-chrome*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Verify store identity and API origins
        run: vp node scripts/release-chrome.mjs verify
      - name: Prepare Google service-account credentials
        if: ${{ !inputs.build_only }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Upload to Chrome Web Store (beta submits for review)
        if: ${{ !inputs.build_only }}
        run: vp node scripts/release-chrome.mjs upload
