name: Release dev

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact dev commit that passed both CI jobs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-development
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      inputs.source_ref == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: api-development
    env:
      RELEASE_BRANCH: dev
      RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
      - name: Check successful CI still matches dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node scripts/release-main.mjs assert-current-source
      - run: vp install --frozen-lockfile
      - name: Check development database readiness
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Set DEV_DATABASE_URL to a read-only connection to the development database."
            exit 1
          fi
          vp node scripts/check-api-migrations.mjs
      - name: Confirm source is still current dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Deploy development Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CHROME_BETA_EXTENSION_ID: ${{ vars.CHROME_BETA_EXTENSION_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set DEV_CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKEN with development Worker deployment permissions."
            exit 1
          fi
          vp run --filter @qcksys/ao3tracker-api deploy:dev
      - name: Smoke test development API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            https://dev.ao3tracker.com/ping --output "$RUNNER_TEMP/api-health.json"
          vp node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const response = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (response.ping !== "pong") throw new Error("Unexpected development health response.");
          ' "$RUNNER_TEMP/api-health.json"

  android:
    needs: deploy
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
    with:
      source_ref: ${{ inputs.source_ref }}
      channel: beta

  chrome:
    needs: deploy
    uses: ./.github/workflows/release-chrome.yml
    secrets: inherit
    with:
      source_ref: ${{ inputs.source_ref }}
      channel: beta
