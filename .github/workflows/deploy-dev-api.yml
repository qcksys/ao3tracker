name: Release dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    uses: ./.github/workflows/prepare-release.yml
    with:
      branch: dev

  deploy:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    concurrency:
      group: api-development
      cancel-in-progress: false
    uses: ./.github/workflows/release-dev-apps.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      api_artifact_id: ${{ needs.prepare.outputs.api_artifact_id }}
