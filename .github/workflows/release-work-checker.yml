name: Publish work checker image

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit whose API deployment succeeded
        required: true
        type: string
      branch:
        description: Release branch (dev or main); also the image tag the hub deploys
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: work-checker-image-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/qcksys/ao3tracker-work-checker
      RELEASE_BRANCH: ${{ inputs.branch }}
      RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$RELEASE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full commit SHA."
            exit 1
          fi
          if [[ "$RELEASE_BRANCH" != "dev" && "$RELEASE_BRANCH" != "main" ]]; then
            echo "::error::branch must be dev or main."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/work-checker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.source_ref }}
          labels: org.opencontainers.image.revision=${{ inputs.source_ref }}
          build-args: SOURCE_REF=${{ inputs.source_ref }}
          cache-from: type=gha,scope=work-checker
          cache-to: type=gha,scope=work-checker,mode=max
      # The hub deploys the branch tag; a superseded commit must not move it.
      - name: Confirm source is still current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Move the deployment tag
        run: docker buildx imagetools create --tag "$IMAGE:$RELEASE_BRANCH" "$IMAGE:$RELEASE_SOURCE_REF"
