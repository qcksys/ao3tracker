name: Deploy development API and release apps

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact dev commit that passed CI and release preparation
        required: true
        type: string
      api_artifact_id:
        description: Built development API artifact from release preparation
        required: true
        type: string

permissions:
  contents: read

# The caller holds its non-canceling release lock until every job here finishes.
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: api-development
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    env:
      RELEASE_BRANCH: dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
      - name: Check successful CI still matches dev
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node scripts/release-main.mjs
      - if: steps.release.outputs.eligible == 'true'
        run: vp install --frozen-lockfile
      - name: Download built API
        if: steps.release.outputs.eligible == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.api_artifact_id }}
          path: apps/api/dist/
      - name: Check development database readiness
        if: steps.release.outputs.eligible == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Set DEV_DATABASE_URL to a read-only connection to the development database."
            exit 1
          fi
          vp node scripts/check-api-migrations.mjs
      - name: Confirm source is still current dev
        if: steps.release.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Deploy development Worker
        if: steps.release.outputs.eligible == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CHROME_BETA_EXTENSION_ID: ${{ vars.CHROME_BETA_EXTENSION_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set DEV_CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKEN with development Worker deployment permissions."
            exit 1
          fi
          vp exec --filter @qcksys/ao3tracker-api wrangler deploy --config dist/ssr/wrangler.json
      - name: Smoke test development API
        if: steps.release.outputs.eligible == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            https://dev.ao3tracker.com/ping --output "$RUNNER_TEMP/api-health.json"
          vp node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const response = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (response.ping !== "pong") throw new Error("Unexpected development health response.");
          ' "$RUNNER_TEMP/api-health.json"

  android:
    needs: deploy
    if: needs.deploy.outputs.eligible == 'true'
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.deploy.outputs.source_ref }}
      channel: beta

  chrome:
    needs: deploy
    if: needs.deploy.outputs.eligible == 'true'
    uses: ./.github/workflows/release-chrome.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.deploy.outputs.source_ref }}
      channel: beta
