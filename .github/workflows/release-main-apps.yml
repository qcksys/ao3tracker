name: Deploy production API and release apps

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit that passed CI and release preparation
        required: true
        type: string
      api_artifact_id:
        description: Built API artifact from release preparation
        required: true
        type: string
      tagged:
        description: Also release Android to Alpha and upload a production Chrome draft
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# The caller holds its non-canceling release lock until every job here finishes.
jobs:
  api:
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit
    with:
      source_ref: ${{ inputs.source_ref }}
      api_artifact_id: ${{ inputs.api_artifact_id }}

  android:
    needs: api
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
    with:
      ci_verified: true
      source_ref: ${{ inputs.source_ref }}
      tracks: ${{ inputs.tagged && 'internal,alpha' || 'internal' }}

  chrome:
    needs: api
    if: inputs.tagged && needs.api.outputs.chrome_required == 'true'
    uses: ./.github/workflows/release-chrome.yml
    secrets: inherit
    with:
      source_ref: ${{ inputs.source_ref }}
