name: Deploy production API

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit SHA that passed CI
        required: true
        type: string
      api_artifact_id:
        description: Built production API artifact from release preparation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: api-production
    steps:
      - name: Validate source commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be the full commit SHA that passed CI."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Download built API
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ inputs.api_artifact_id }}
          path: apps/api/dist/
      - name: Confirm source before production migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: vp node apps/api/scripts/migrate.mjs
      - name: Verify production database after migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: vp node scripts/check-api-migrations.mjs
      - name: Confirm source is still current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
        run: vp node scripts/release-main.mjs assert-current-source
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the api-production environment."
            exit 1
          fi
          vp exec --filter @qcksys/ao3tracker-api wrangler deploy --config dist/ssr/wrangler.json
      - name: Smoke test production API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            https://ao3tracker.com/ping --output "$RUNNER_TEMP/api-health.json"
          vp node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const response = JSON.parse(await readFile(process.argv[1], "utf8"));
            if (response.ping !== "pong") throw new Error("Unexpected production health response.");
          ' "$RUNNER_TEMP/api-health.json"
