name: Release main

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact tested commit with newly created Changesets tags
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_ref == github.sha
    uses: ./.github/workflows/prepare-release.yml
    with:
      branch: main

  deploy:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    concurrency:
      group: release-main
      cancel-in-progress: false
    uses: ./.github/workflows/release-main-apps.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      api_artifact_id: ${{ needs.prepare.outputs.api_artifact_id }}
