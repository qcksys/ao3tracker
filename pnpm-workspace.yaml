packages:
  - apps/*
  - apps/native-kmp/webview-scripts
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  vue-demi: true
  workerd: true

# These exact Cloudflare versions were already locked and tested before the pnpm upgrade.
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.3.3"
  - miniflare@5.20260926.1-alpha
  - wrangler@4.144.0

catalog:
  "@base-ui/react": ^1.8.0
  "@better-auth/passkey": ^1.7.6
  "@biomejs/biome": ^2.5.14
  "@changesets/cli": ^3.0.3
  "@cloudflare/vite-plugin": ^1.62.0
  "@cloudflare/vitest-plugin": ^1.3.3
  "@hono/zod-openapi": ^1.6.3
  "@hookform/resolvers": ^5.9.1
  # Drizzle RC still requires the parameterized execute API removed in driver 2.x.
  "@planetscale/database": ^1.20.2
  "@qcksys/drizzle-extensions": ^0.3.0
  "@scalar/hono-api-reference": ^0.12.7
  "@scalar/openapi-to-markdown": ^1.4.0
  "@simplewebauthn/server": 13.3.0
  "@tailwindcss/vite": ^4.3.3
  "@types/chrome": ^0.3.4
  "@types/node": ^24.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@varlock/1password-plugin": ^2.0.4
  "@wxt-dev/module-react": ^1.2.2
  "@wxt-dev/storage": ^1.2.9
  better-auth: ^1.7.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  date-fns: ^4.4.0
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  happy-dom: ^20.14.5
  hono: ^4.13.11
  jose: ^6.2.12
  ky: ^2.1.0
  lucide-react: ^1.48.0
  next-themes: ^0.4.6
  portless: ^0.15.6
  react: ^19.3.0
  react-dom: ^19.3.0
  react-hook-form: ^7.89.0
  react-router: ^8.4.0
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  varlock: ^1.21.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  web-ext: ^10.7.0
  wrangler: ^4.144.0
  wxt: ^0.21.4
  zod: ^4.6.5

catalogMode: prefer
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  "fast-uri@>=3.0.0 <3.1.8": ^3.1.8
  "undici@>=7.0.0 <7.29.1": ^7.30.0
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
