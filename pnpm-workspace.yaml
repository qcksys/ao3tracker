packages:
  - apps/*
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  vue-demi: true
  workerd: true

catalog:
  '@changesets/cli': ^2.31.0
  "@types/node": ^24
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
